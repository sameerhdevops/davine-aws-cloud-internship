<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="690" viewBox="0 0 1320 690" role="img" aria-labelledby="title desc">
<title id="title">TalentFlow AI documented intended architecture</title><desc id="desc">An explanatory architecture based on the final report: client traffic reaches an Application Load Balancer, private application tier, relational database, encrypted object storage, EventBridge, and SQS.</desc>
<style>text{font-family:Arial,sans-serif;fill:#172033}.t{font-size:29px;font-weight:bold}.h{font-size:18px;font-weight:bold}.s{font-size:14px}.boundary{fill:#f8fafc;stroke:#456b8f;stroke-width:2}.tier{fill:#eef6ff;stroke:#5c8fc0;stroke-width:2;stroke-dasharray:7 5}.svc{fill:#dceeff;stroke:#21639a;stroke-width:2}.compute{fill:#fff1dc;stroke:#b96b00;stroke-width:2}.event{fill:#fbe8ef;stroke:#b14f77;stroke-width:2}.a{stroke:#334155;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<rect width="1320" height="690" fill="white"/><text x="45" y="48" class="t">TalentFlow AI: documented intended architecture</text><text x="45" y="75" class="s">Reconstructed from the final-submission report; it does not prove every component was deployed.</text>
<rect x="170" y="105" width="710" height="495" rx="18" class="boundary"/><text x="195" y="138" class="h">Documented AWS VPC boundary</text>
<rect x="220" y="165" width="610" height="85" rx="12" class="tier"/><text x="245" y="195" class="h">Public ingress tier</text><rect x="455" y="185" width="230" height="48" rx="8" class="svc"/><text x="500" y="216" class="h">Application Load Balancer</text>
<rect x="220" y="290" width="610" height="135" rx="12" class="tier"/><text x="245" y="320" class="h">Private application tier</text><rect x="420" y="340" width="285" height="55" rx="8" class="compute"/><text x="472" y="374" class="h">EC2 application instances</text>
<rect x="220" y="465" width="610" height="95" rx="12" class="tier"/><text x="245" y="495" class="h">Private database tier</text><rect x="430" y="500" width="260" height="42" rx="8" class="svc"/><text x="478" y="527" class="h">RDS for MySQL</text>
<rect x="1000" y="190" width="225" height="58" rx="8" class="svc"/><text x="1047" y="226" class="h">Encrypted S3</text><rect x="1000" y="325" width="225" height="58" rx="8" class="event"/><text x="1060" y="361" class="h">EventBridge</text><rect x="1000" y="460" width="225" height="58" rx="8" class="event"/><text x="1082" y="496" class="h">SQS</text>
