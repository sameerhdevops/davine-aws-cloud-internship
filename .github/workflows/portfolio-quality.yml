name: Portfolio quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, final-polish]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-and-markdown:
    name: Python and documentation quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install pinned audit and lint dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python lint
        run: ruff check demos scripts tests
      - name: Check Python formatting
        run: ruff format --check demos scripts tests
      - name: Check relative links and anchors
        run: python scripts/check_markdown_links.py
      - name: Check weekly pages and evidence manifest
        run: python scripts/check_portfolio.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run VPC demonstration
        run: python demos/week03_vpc/validate.py
      - name: Compile Python files
        run: python -m compileall -q demos scripts tests

  terraform:
    name: Validate reconstructed Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assignments/week-12-talentflow-ai/infrastructure/terraform
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check
      - name: Initialize without a remote backend
        run: terraform init -backend=false -input=false -no-color
      - name: Validate configuration
        run: terraform validate -no-color

  secret-scan:
    name: Scan repository history for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
