name: Portfolio quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-links:
    name: Check local Markdown links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check relative links and anchors
        run: python scripts/check_markdown_links.py

  terraform:
    name: Validate reconstructed Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assignments/week-12-talentflow-ai/infrastructure/terraform
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check
      - name: Initialize without a remote backend
        run: terraform init -backend=false -input=false -no-color
      - name: Validate configuration
        run: terraform validate -no-color
